version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: codemeet_db
    environment:
      POSTGRES_USER: codemeet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codemeet_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: codemeet_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
